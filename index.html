<!DOCTYPE html>
<html lang="fr">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table de Billard Réaliste</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #1e272e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #dcdde1;
            user-select: none;
        }
        h1 { margin-bottom: 5px; font-size: 26px; letter-spacing: 1px; }
        p { margin-top: 0; margin-bottom: 25px; color: #718093; }

                /* Style réaliste pour les mouches (repères diamants) */
        .diamond {
            width: 8px;
            height: 8px;
            background-color: #f1f2f6;
            transform: rotate(45deg);
            box-shadow: 1px 1px 2px rgba(0,0,0,0.6), inset -1px -1px 1px rgba(0,0,0,0.3);
            opacity: 0.85;
            pointer-events: none;
        }


        
        #table-frame {
            position: relative;
            width: 860px;
            height: 460px;
            background: linear-gradient(135deg, #4a2711, #2c160a);
            border: 4px solid #1a0d06;
            border-radius: 18px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7), inset 0 2px 5px rgba(255,255,255,0.2);
            padding: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #pool-table {
            position: relative;
            width: 800px;
            height: 400px;
            background: radial-gradient(circle, #0f7a44 40%, #0a522d 100%);
            box-shadow: inset 0 10px 20px rgba(0,0,0,0.5);
        }
        /* Bandes physiques ajustées aux nouvelles positions de vos poches */
.cushion { position: absolute; background-color: #0b6134; box-shadow: inset 0 4px 6px rgba(255,255,255,0.1); z-index: 2; }

/* Bandes supérieures (laissent un espace parfait pour .tc à left: 374px) */
.cushion.top-left { top: 0; left: 30px; width: 342px; height: 18px; border-bottom: 12px solid #084726; border-left: 12px solid transparent; border-right: 12px solid transparent; }
.cushion.top-right { top: 0; right: 30px; width: 342px; height: 18px; border-bottom: 12px solid #084726; border-left: 12px solid transparent; border-right: 12px solid transparent; }

/* Bandes inférieures (laissent un espace parfait pour .bc à left: 374px) */
.cushion.bottom-left { bottom: 0; left: 30px; width: 342px; height: 18px; border-top: 12px solid #0f522e; border-left: 12px solid transparent; border-right: 12px solid transparent; }
.cushion.bottom-right { bottom: 0; right: 30px; width: 342px; height: 18px; border-top: 12px solid #0f522e; border-left: 12px solid transparent; border-right: 12px solid transparent; }

/* Bandes verticales latérales */
.cushion.left { top: 30px; left: 0; width: 18px; height: 340px; border-right: 12px solid #084726; border-top: 12px solid transparent; border-bottom: 12px solid transparent; }
.cushion.right { top: 30px; right: 0; width: 18px; height: 340px; border-left: 12px solid #0f522e; border-top: 12px solid transparent; border-bottom: 12px solid transparent; }



        /* Poches rabaissées au z-index: 1 pour passer SOUS les billes (qui ont un z-index supérieur) */
        .pocket { position: absolute; width: 44px; height: 44px; background: radial-gradient(circle, #000 60%, #222 100%); border-radius: 50%; border: 3px solid #333; z-index: 1; }
        .tl { top: -14px; left: -14px; box-shadow: 3px 3px 5px rgba(0,0,0,0.5); }
        .tc { top: -18px; left: 374px; box-shadow: 0px 3px 5px rgba(0,0,0,0.5); }
        .tr { top: -14px; right: -14px; box-shadow: -3px 3px 5px rgba(0,0,0,0.5); }
        .bl { bottom: -14px; left: -14px; box-shadow: 3px -3px 5px rgba(0,0,0,0.5); }
        .bc { bottom: -18px; left: 374px; box-shadow: 0px -3px 5px rgba(0,0,0,0.5); }
        .br { bottom: -14px; right: -14px; box-shadow: -3px -3px 5px rgba(0,0,0,0.5); }

        /* z-index: 10 pour que les billes passent au-dessus des poches et des bandes */
        
                /* Style des billes avec rendu 3D sphérique amélioré */
        .ball {
            position: absolute;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: move;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            box-shadow: 3px 5px 6px rgba(0, 0, 0, 0.4); /* Ombre sur le tapis */
        }
        
        /* Effet de brillance 3D universel (appliqué via un pseudo-élément ::after) */
        .ball::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 50%;
            /* Ombre interne et reflet blanc brillant en haut à gauche */
            background-image: radial-gradient(circle at 8px 8px, rgba(255,255,255,0.7) 0%, rgba(255,255,255,0) 45%, rgba(0,0,0,0.35) 100%);
            pointer-events: none;
            z-index: 3;
        }
        
        .ball:active { 
            box-shadow: 6px 12px 10px rgba(0, 0, 0, 0.5); 
            z-index: 1000; 
        }

        /* Pastille blanche interne pour le numéro */
        .ball-num { 
            background-color: white; 
            width: 13px; 
            height: 13px; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: black; 
            font-family: 'Arial Black', sans-serif; 
            font-size: 8px; 
            box-shadow: inset 1px 1px 2px rgba(0,0,0,0.4);
            z-index: 2; /* Passe sous le reflet brillant, mais sur la rayure */
        }
        
        /* NOURRITURE VISUELLE : Vraie rayure de billard américain (9 à 15) */
        /* Utilise la couleur de fond héritée (b.color) injectée par le JS pour créer la bande centrale */
        .striped {
            background-color: white !important; /* Les calottes polaires deviennent blanches */
            background-image: linear-gradient(
                to bottom,
                #ffffff 22%,
                var(--ball-color) 22%,
                var(--ball-color) 78%,
                #ffffff 78%
            ) !important;
        }

/* Assurez-vous que votre table est bien en position relative */
#pool-table {
    position: relative;
}

/* Le conteneur de la grille qui recouvre toute la table */
.grid-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: repeat(17, 1fr); /* 17 colonnes */
    grid-template-rows: repeat(9, 1fr);     /* 9 lignes */
    pointer-events: none;                   /* Permet de cliquer à travers sur les billes */
    z-index: 1;                             /* Reste sous les billes mais sur le tapis */
}

/* Les lignes de la grille */
.grid-overlay div {
    border-right: 1px dashed rgba(255, 255, 255, 0.15);
    border-bottom: 1px dashed rgba(255, 255, 255, 0.15);
}

/* Bordures extérieures optionnelles pour fermer la grille */
.grid-overlay {
    border-top: 1px dashed rgba(255, 255, 255, 0.15);
    border-left: 1px dashed rgba(255, 255, 255, 0.15);
}

#grid-overlay {
    display: none; /* Masqué par défaut */
    pointer-events: none; /* Laisse passer les clics pour glisser les billes */
    box-sizing: border-box;
}

#grid-overlay div {
    border: 1px solid rgba(255, 255, 255, 0.08); /* Lignes subtiles pour le tapis */
    box-sizing: border-box;
}





    </style>
</head>
<body>

        <h1>Table de Billard Interactive</h1>
    <p>Positionnez vos billes. Exportez ou importez vos configurations via des fichiers JSON.</p>

    <!-- AJOUT : Champs de texte pour le Titre et la Description -->
    <div style="margin-bottom: 20px; display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 860px; background-color: #2c3a47; padding: 15px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.3);">
        <div style="display: flex; flex-direction: column; gap: 5px;">
            <label for="input-title" style="font-weight: bold; font-size: 14px; color: #f5f6fa;">Titre de la configuration :</label>
            <input type="text" id="input-title" value="Ma configuration de billard" style="padding: 10px; background-color: #1e272e; color: white; border: 1px solid #57606f; border-radius: 5px; font-size: 14px; font-weight: bold;">
        </div>
        <div style="display: flex; flex-direction: column; gap: 5px;">
            <label for="input-desc" style="font-weight: bold; font-size: 14px; color: #f5f6fa;">Description / Notes :</label>
            <textarea id="input-desc" rows="2" style="padding: 10px; background-color: #1e272e; color: white; border: 1px solid #57606f; border-radius: 5px; font-size: 14px; resize: vertical;" placeholder="Ajoutez des notes ou des instructions sur cette disposition de billes..."></textarea>
        </div>
    </div>

   
    <!-- BARRE DE BOUTONS MAJ AVEC SÉLECTEUR 1 À 15 -->
    <div style="margin-bottom: 20px; display: flex; gap: 15px; align-items: center; flex-wrap: wrap;">
        <div style="display: flex; align-items: center; gap: 8px;">
            <label for="select-balls-count" style="font-weight: bold; font-size: 14px;">Billes sur la table :</label>
            <select id="select-balls-count" style="padding: 9px 15px; background-color: #34495e; color: white; border: 1px solid #57606f; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 14px;">
                <option value="0">Bille blanche uniquement</option>
                <option value="1">Blanche + 1 bille</option>
                <option value="2">Blanche + 2 billes</option>
                <option value="3">Blanche + 3 billes</option>
                <option value="4">Blanche + 4 billes</option>
                <option value="5">Blanche + 5 billes</option>
                <option value="6">Blanche + 6 billes</option>
                <option value="7">Blanche + 7 billes</option>
                <option value="8">Blanche + 8 billes</option>
                <option value="9">Blanche + 9 billes</option>
                <option value="10">Blanche + 10 billes</option>
                <option value="11">Blanche + 11 billes</option>
                <option value="12">Blanche + 12 billes</option>
                <option value="13">Blanche + 13 billes</option>
                <option value="14">Blanche + 14 billes</option>
                <option value="15" selected>Blanche + 15 billes (Complet)</option>
            </select>
        </div>

        <button id="btn-export" style="padding: 10px 20px; background-color: #27ae60; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">Exporter en JSON</button>
        <button id="btn-import-trigger" style="padding: 10px 20px; background-color: #2980b9; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">Importer un JSON</button>
        <input type="file" id="file-import" accept=".json" style="display: none;">
<label class="toggle-grid">
    <input type="checkbox" id="chk-toggle-grid"> Afficher la grille
</label>

<!-- Nouveaux contrôles pour le dessin -->
<div class="drawing-controls" style="margin: 10px 0; display: flex; gap: 10px; align-items: center;">
    <label for="marker-color">Couleur du tracé :</label>
    <select id="marker-color">
        <option value="#ffffff" selected>Blanc</option>
        <option value="#e74c3c">Rouge</option>
        <option value="#f1c40f">Jaune</option>
        <option value="#2ecc71">Vert fluo</option>
    </select>

<label>
    <input type="checkbox" id="chk-straight-line"> 📐 Lignes droites
</label>
<button id="btn-undo-lines">↩️ Annuler (Ctrl+Z)</button>


    <button id="btn-clear-lines" type="button" style="padding: 5px 10px; cursor: pointer;">
        Effacer les lignes
    </button>
</div>


    
    </div>

        <!-- La table de billard avec mouches et spots -->
    <div id="table-frame">
        <!-- Les 18 Diamants (Mouches) sur la structure en bois -->
        <!-- Bande Haut -->
        <div class="diamond th-1" style="position: absolute; top: 11px; left: 130px;"></div>
        <div class="diamond th-2" style="position: absolute; top: 11px; left: 230px;"></div>
        <div class="diamond th-3" style="position: absolute; top: 11px; left: 330px;"></div>
        <div class="diamond th-4" style="position: absolute; top: 11px; left: 530px;"></div>
        <div class="diamond th-5" style="position: absolute; top: 11px; left: 630px;"></div>
        <div class="diamond th-6" style="position: absolute; top: 11px; left: 730px;"></div>
        <!-- Bande Bas -->
        <div class="diamond bh-1" style="position: absolute; bottom: 11px; left: 130px;"></div>
        <div class="diamond bh-2" style="position: absolute; bottom: 11px; left: 230px;"></div>
        <div class="diamond bh-3" style="position: absolute; bottom: 11px; left: 330px;"></div>
        <div class="diamond bh-4" style="position: absolute; bottom: 11px; left: 530px;"></div>
        <div class="diamond bh-5" style="position: absolute; bottom: 11px; left: 630px;"></div>
        <div class="diamond bh-6" style="position: absolute; bottom: 11px; left: 730px;"></div>
        <!-- Bande Gauche -->
        <div class="diamond lv-1" style="position: absolute; left: 11px; top: 130px;"></div>
        <div class="diamond lv-2" style="position: absolute; left: 11px; top: 230px;"></div>
        <div class="diamond lv-3" style="position: absolute; left: 11px; top: 330px;"></div>
        <!-- Bande Droite -->
        <div class="diamond rv-1" style="position: absolute; right: 11px; top: 130px;"></div>
        <div class="diamond rv-2" style="position: absolute; right: 11px; top: 230px;"></div>
        <div class="diamond rv-3" style="position: absolute; right: 11px; top: 330px;"></div>

        <div id="pool-table">

            <!-- À insérer à l'intérieur de <div id="pool-table"> -->
<!-- À insérer à l'intérieur de <div id="pool-table"> -->
<canvas id="drawing-canvas" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10;"></canvas>

            <!-- Traçage du tapis : Head string (Ligne de cadre) -->
            <div style="position: absolute; top: 18px; bottom: 18px; left: 200px; width: 1px; background-color: rgba(255,255,255,0.15); pointer-events: none; z-index: 0;"></div>

<!-- À insérer à l'intérieur de <div id="pool-table">...</div> -->
<div id="grid-overlay" class="grid-overlay" style="display: none;"></div>
            
            <!-- Les Points réglementaires (Spots) -->
            <!-- Head Spot (Point de choc pour la blanche) -->
            <div style="position: absolute; left: 200px; top: 200px; width: 6px; height: 6px; background-color: #fff; border-radius: 50%; transform: translate(-50%, -50%); opacity: 0.6; pointer-events: none; z-index: 0; box-shadow: 0 0 4px #000;"></div>
            <!-- Foot Spot (Point de replacement / Sommet du triangle à 3/4 de la table) -->
            <div style="position: absolute; left: 600px; top: 200px; width: 6px; height: 6px; background-color: #fff; border-radius: 50%; transform: translate(-50%, -50%); opacity: 0.6; pointer-events: none; z-index: 0; box-shadow: 0 0 4px #000;"></div>

            <!-- Bandes physiques -->
            <div class="cushion top-left"></div>
            <div class="cushion top-right"></div>
            <div class="cushion bottom-left"></div>
            <div class="cushion bottom-right"></div>
            <div class="cushion left"></div>
            <div class="cushion right"></div>

            <!-- Poches -->
            <div class="pocket tl"></div>
            <div class="pocket tc"></div>
            <div class="pocket tr"></div>
            <div class="pocket bl"></div>
            <div class="pocket bc"></div>
            <div class="pocket br"></div>
        </div>
    </div>


        <!-- Liaison avec vos deux scripts séparés -->
    <script src="physique.js"></script>
    <script src="outils.js"></script>
    <script src="dessin.js"></script>
</body>
</html>
