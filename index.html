<!DOCTYPE html>
<html lang="fr">
<head>

   
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Diagramme de billard</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #1e272e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #dcdde1;
            user-select: none;
        }
        h1 { margin-bottom: 5px; font-size: 26px; letter-spacing: 1px; }
        p { margin-top: 0; margin-bottom: 25px; color: #718093; }

                /* Style réaliste pour les mouches (repères diamants) */
        .diamond {
            width: 8px;
            height: 8px;
            background-color: #f1f2f6;
            transform: rotate(45deg);
            box-shadow: 1px 1px 2px rgba(0,0,0,0.6), inset -1px -1px 1px rgba(0,0,0,0.3);
            opacity: 0.85;
            pointer-events: none;
        }


        
        #table-frame {
            position: relative;
            width: 860px;
            height: 460px;
            background: linear-gradient(135deg, #4a2711, #2c160a);
            border: 4px solid #1a0d06;
            border-radius: 18px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7), inset 0 2px 5px rgba(255,255,255,0.2);
            padding: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #pool-table {
            position: relative;
            width: 800px;
            height: 400px;
            background: radial-gradient(circle, #0f7a44 40%, #0a522d 100%);
            box-shadow: inset 0 10px 20px rgba(0,0,0,0.5);
        }
        /* Bandes physiques ajustées aux nouvelles positions de vos poches */
.cushion { position: absolute; background-color: #0b6134; box-shadow: inset 0 4px 6px rgba(255,255,255,0.1); z-index: 2; }

/* Bandes supérieures (laissent un espace parfait pour .tc à left: 374px) */
.cushion.top-left { top: 0; left: 30px; width: 342px; height: 18px; border-bottom: 12px solid #084726; border-left: 12px solid transparent; border-right: 12px solid transparent; }
.cushion.top-right { top: 0; right: 30px; width: 342px; height: 18px; border-bottom: 12px solid #084726; border-left: 12px solid transparent; border-right: 12px solid transparent; }

/* Bandes inférieures (laissent un espace parfait pour .bc à left: 374px) */
.cushion.bottom-left { bottom: 0; left: 30px; width: 342px; height: 18px; border-top: 12px solid #0f522e; border-left: 12px solid transparent; border-right: 12px solid transparent; }
.cushion.bottom-right { bottom: 0; right: 30px; width: 342px; height: 18px; border-top: 12px solid #0f522e; border-left: 12px solid transparent; border-right: 12px solid transparent; }

/* Bandes verticales latérales */
.cushion.left { top: 30px; left: 0; width: 18px; height: 340px; border-right: 12px solid #084726; border-top: 12px solid transparent; border-bottom: 12px solid transparent; }
.cushion.right { top: 30px; right: 0; width: 18px; height: 340px; border-left: 12px solid #0f522e; border-top: 12px solid transparent; border-bottom: 12px solid transparent; }



        /* Poches rabaissées au z-index: 1 pour passer SOUS les billes (qui ont un z-index supérieur) */
        .pocket { position: absolute; width: 44px; height: 44px; background: radial-gradient(circle, #000 60%, #222 100%); border-radius: 50%; border: 3px solid #333; z-index: 1; }
        .tl { top: -14px; left: -14px; box-shadow: 3px 3px 5px rgba(0,0,0,0.5); }
        .tc { top: -18px; left: 374px; box-shadow: 0px 3px 5px rgba(0,0,0,0.5); }
        .tr { top: -14px; right: -14px; box-shadow: -3px 3px 5px rgba(0,0,0,0.5); }
        .bl { bottom: -14px; left: -14px; box-shadow: 3px -3px 5px rgba(0,0,0,0.5); }
        .bc { bottom: -18px; left: 374px; box-shadow: 0px -3px 5px rgba(0,0,0,0.5); }
        .br { bottom: -14px; right: -14px; box-shadow: -3px -3px 5px rgba(0,0,0,0.5); }

        /* z-index: 10 pour que les billes passent au-dessus des poches et des bandes */
        
                /* Style des billes avec rendu 3D sphérique amélioré */
        .ball {
            position: absolute;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: move;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            box-shadow: 3px 5px 6px rgba(0, 0, 0, 0.4); /* Ombre sur le tapis */
        }
        
        /* Effet de brillance 3D universel (appliqué via un pseudo-élément ::after) */
        .ball::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 50%;
            /* Ombre interne et reflet blanc brillant en haut à gauche */
            background-image: radial-gradient(circle at 8px 8px, rgba(255,255,255,0.7) 0%, rgba(255,255,255,0) 45%, rgba(0,0,0,0.35) 100%);
            pointer-events: none;
            z-index: 3;
        }
        
        .ball:active { 
            box-shadow: 6px 12px 10px rgba(0, 0, 0, 0.5); 
            z-index: 1000; 
        }

        /* Pastille blanche interne pour le numéro */
        .ball-num { 
            background-color: white; 
            width: 13px; 
            height: 13px; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: black; 
            font-family: 'Arial Black', sans-serif; 
            font-size: 8px; 
            box-shadow: inset 1px 1px 2px rgba(0,0,0,0.4);
            z-index: 2; /* Passe sous le reflet brillant, mais sur la rayure */
        }
        
        /* NOURRITURE VISUELLE : Vraie rayure de billard américain (9 à 15) */
        /* Utilise la couleur de fond héritée (b.color) injectée par le JS pour créer la bande centrale */
        .striped {
            background-color: white !important; /* Les calottes polaires deviennent blanches */
            background-image: linear-gradient(
                to bottom,
                #ffffff 22%,
                var(--ball-color) 22%,
                var(--ball-color) 78%,
                #ffffff 78%
            ) !important;
        }

/* Assurez-vous que votre table est bien en position relative */
#pool-table {
    position: relative;
}

/* Le conteneur de la grille qui recouvre toute la table */
.grid-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: repeat(17, 1fr); /* 17 colonnes */
    grid-template-rows: repeat(9, 1fr);     /* 9 lignes */
    pointer-events: none;                   /* Permet de cliquer à travers sur les billes */
    z-index: 1;                             /* Reste sous les billes mais sur le tapis */
}

/* Les lignes de la grille */
.grid-overlay div {
    border-right: 1px dashed rgba(255, 255, 255, 0.15);
    border-bottom: 1px dashed rgba(255, 255, 255, 0.15);
}

/* Bordures extérieures optionnelles pour fermer la grille */
.grid-overlay {
    border-top: 1px dashed rgba(255, 255, 255, 0.15);
    border-left: 1px dashed rgba(255, 255, 255, 0.15);
}

#grid-overlay {
    display: none; /* Masqué par défaut */
    pointer-events: none; /* Laisse passer les clics pour glisser les billes */
    box-sizing: border-box;
}

#grid-overlay div {
    border: 1px solid rgba(255, 255, 255, 0.08); /* Lignes subtiles pour le tapis */
    box-sizing: border-box;
}

/* Conteneur principal pliable ajusté à la table */
.controls-accordion {
    background-color: #2c3e50;
    color: #ffffff;
    border-radius: 8px;
    margin: 15px auto; /* Centrage automatique si la table est centrée */
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    overflow: hidden;
    border: 1px solid #34495e;
    
    /* --- ALIGNEMENT SUR LA LARGEUR DE LA TABLE --- */
    width: 100%;
    max-width: 800px; /* Aligné sur la coordonnée maximale de 800px définie dans clampPosition */
    box-sizing: border-box; /* Évite que les paddings/bordures dépassent de la largeur */
}

/* En-tête cliquable */
.controls-summary {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 20px;
    font-weight: bold;
    cursor: pointer;
    user-select: none;
    background-color: #34495e;
    transition: background-color 0.2s ease;
    box-sizing: border-box;
}

.controls-summary:hover {
    background-color: #415b76;
}

/* Masquer la flèche native du navigateur */
.controls-summary::-webkit-details-marker,
.controls-summary::marker {
    display: none;
}

/* Animation du chevron */
.controls-summary .summary-chevron {
    font-size: 0.8rem;
    transition: transform 0.2s ease;
}

/* Rotation du chevron quand le panneau est ouvert */
.controls-accordion[open] .summary-chevron {
    transform: rotate(180deg);
}

/* Contenu interne */
.controls-content {
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 15px;
    box-sizing: border-box;
}

/* Section regroupant les textes */
.text-fields-section {
    display: flex;
    flex-direction: column;
    gap: 16px;
    width: 100%;
    box-sizing: border-box;
}

/* Groupe de formulaire (Label + Champ) */
.form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 100%;
}

/* Style des étiquettes (Labels) */
.form-label {
    font-size: 0.85rem;
    font-weight: 600;
    color: #b9bbbe; /* Gris clair élégant */
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

/* Conteneur pour inclure l'icône dans le titre */
.input-wrapper {
    position: relative;
    display: flex;
    align-items: center;
}

.input-wrapper .input-icon {
    position: absolute;
    left: 12px;
    font-size: 0.95rem;
    pointer-events: none;
    opacity: 0.7;
}

/* Style commun pour l'Input et le Textarea */
.form-control {
    width: 100%;
    background-color: #1e2b38; /* Plus sombre que le fond du panneau pour du contraste */
    color: #ffffff;
    border: 1px solid #3d566e;
    border-radius: 6px;
    padding: 10px 12px;
    font-family: inherit;
    font-size: 0.95rem;
    box-sizing: border-box;
    transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
}

/* Ajustement spécifique pour le titre avec icône (décalage à gauche) */
.input-wrapper .form-control {
    padding-left: 36px;
}

/* Ajustement spécifique pour la zone de texte */
.textarea-control {
    resize: vertical; /* Permet à l'utilisateur d'ajuster la hauteur uniquement */
    min-height: 80px;
    line-height: 1.4;
}

/* Styles au survol (Hover) */
.form-control:hover {
    border-color: #5d7e9e;
    background-color: #223140;
}

/* Styles lors de la saisie (Focus) */
.form-control:focus {
    outline: none;
    border-color: #3498db; /* Bleu vif pour attirer l'attention de manière propre */
    background-color: #1e2b38;
    box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.25); /* Effet de halo doux */
}

/* Style des placeholders (textes d'aide en fond) */
.form-control::placeholder {
    color: #627d98;
    font-style: italic;
    opacity: 0.8;
}

/* Conteneur de la ligne de boutons */
.actions-button-row {
    display: flex;
    gap: 12px; /* Espace uniforme entre chaque bouton */
    width: 100%;
    margin-top: 8px;
    box-sizing: border-box;
}

/* Base commune pour tous les boutons */
.btn {
    flex: 1; /* Permet aux boutons de prendre exactement la même largeur */
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px 16px;
    font-family: inherit;
    font-size: 0.9rem;
    font-weight: 600;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    user-select: none;
    transition: background-color 0.2s ease, transform 0.1s ease, box-shadow 0.2s ease;
}

/* Effet d'enfoncement au clic pour tous les boutons */
.btn:active {
    transform: scale(0.98);
}

.btn .btn-icon {
    font-size: 1rem;
}

/* 1. Bouton Exporter (Action principale) */
.btn-primary {
    background-color: #3498db;
    color: #ffffff;
}
.btn-primary:hover {
    background-color: #2980b9;
    box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.25);
}

/* 2. Bouton Importer */
.btn-secondary {
    background-color: #34495e;
    color: #ffffff;
    border: 1px solid #4f6f8f;
}
.btn-secondary:hover {
    background-color: #415b76;
    border-color: #5d7e9e;
}

/* 3. Bouton Annuler Tracé */
.btn-action {
    background-color: #16a085;
    color: #ffffff;
}
.btn-action:hover {
    background-color: #117a65;
    box-shadow: 0 0 0 3px rgba(22, 160, 133, 0.25);
}

/* 4. Bouton Effacer Tout (Danger) */
.btn-danger {
    background-color: #e74c3c;
    color: #ffffff;
}
.btn-danger:hover {
    background-color: #c0392b;
    box-shadow: 0 0 0 3px rgba(231, 76, 60, 0.25);
}

/* Gestion de la réactivité si l'écran devient trop petit */
@media (max-width: 600px) {
    .actions-button-row {
        flex-direction: column; /* Aligne les boutons verticalement sur mobile */
        gap: 8px;
    }
}

#table-title-overlay {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-family: sans-serif;
    font-size: 32px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 2px;
    pointer-events: none; /* Laisse passer les clics pour pouvoir bouger les billes dessous */
    z-index: 1;           /* Derrière les billes mais visible sur le tapis */
    
    /* Couleur très discrète : blanc avec une très forte transparence */
    color: rgba(255, 255, 255, 0.08); 
    
    /* Optionnel : si votre tapis est vert standard, vous pouvez aussi utiliser un vert discret comme : 
    color: rgba(20, 100, 40, 0.4); */
    
    /* MODIFICATIONS POUR LE RETOUR À LA LIGNE */
    white-space: normal;    /* Autorise le changement de ligne */
    text-align: center;     /* Centre le texte sur les nouvelles lignes */
    width: 100%;            /* Limite la largeur pour forcer le retour à la ligne avant les bords */
    max-width: 1200px;       /* Optionnel : empêche le conteneur de devenir trop large sur grand écran */
    user-select: none;
}



    </style>
</head>
